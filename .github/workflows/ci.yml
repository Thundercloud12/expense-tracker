name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📄 Create .env file
        run: |
          echo "VITE_APPWRITE_URL=${{ secrets.VITE_APPWRITE_URL }}" >> .env
          echo "VITE_PROJECT_ID=${{ secrets.VITE_PROJECT_ID }}" >> .env
          echo "VITE_APPWRITE_DATABASE_ID=${{ secrets.VITE_APPWRITE_DATABASE_ID }}" >> .env
          echo "VITE_APPWRITE_COLLECTION_USER=${{ secrets.VITE_APPWRITE_COLLECTION_USER }}" >> .env
          echo "VITE_APPWRITE_COLLECTION_EXPENSES=${{ secrets.VITE_APPWRITE_COLLECTION_EXPENSES}}" >> .env
          

      - name: ✅ Run Tests
        run: npm test
